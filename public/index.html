<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c0d10">
  <title>動画リスト</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">VIDEO COLLECTION</p>
        <h1>動画リスト</h1>
        <p class="subtitle">動画IDを登録して、いつでもすぐ開けるように保存できます。</p>
      </div>
      <div class="count-badge"><span id="count">0</span> 件</div>
    </header>

    <section class="panel add-panel" aria-label="動画を登録">
      <div class="panel-heading">
        <div>
          <h2>動画を登録</h2>
          <p>YouTube系の動画IDだけを貼り付けてください。</p>
        </div>
      </div>
      <form id="add-form" class="add-form">
        <input id="video-id" name="videoId" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="例: dQw4w9WgXcQ" maxlength="20" required>
        <button class="primary" type="submit">リストに登録</button>
      </form>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </section>

    <section class="toolbar" aria-label="リスト検索">
      <div class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.5-4.5m2-5.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" type="search" placeholder="動画の題名で検索" autocomplete="off">
      </div>
      <button id="clear-search" class="ghost" type="button">検索をクリア</button>
    </section>

    <section id="list" class="video-list" aria-live="polite"></section>
    <div id="empty" class="empty-state">
      <div class="empty-icon">＋</div>
      <h2>まだ動画がありません</h2>
      <p>上の入力欄から動画IDを登録してください。</p>
    </div>
  </main>

  <template id="card-template">
    <article class="video-card">
      <a class="thumb-link" target="_blank" rel="noopener noreferrer">
        <div class="thumb-wrap">
          <img class="thumb" loading="lazy" alt="">
          <span class="thumb-fallback">NO IMAGE</span>
        </div>
      </a>
      <div class="video-info">
        <a class="video-title" target="_blank" rel="noopener noreferrer"></a>
        <div class="video-meta">
          <code class="video-id"></code>
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-text">題名を取得中…</span>
        </div>
      </div>
      <button class="delete-button" type="button" title="この動画を削除" aria-label="この動画を削除">×</button>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
